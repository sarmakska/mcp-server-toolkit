name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          version: latest

      - name: Set up Python
        run: uv python install 3.12

      - name: Compile syntax check
        run: uv run --with-requirements <(echo "") python -m compileall -q . || python -m compileall -q .

      - name: Lint (best-effort)
        run: uv tool run ruff check . || true
