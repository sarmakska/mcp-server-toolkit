[project]
name = "mcp-server-toolkit"
version = "1.0.0"
description = "Production-ready Model Context Protocol server starter with auth, tracing, and a plugin system."
authors = [{ name = "Sarma Linux", email = "sarma@sarmalinux.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "mcp>=1.4",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.13.4",
  "pydantic-settings>=2.6",
  "typer>=0.12",
  "structlog>=24",
  "opentelemetry-api>=1.29",
  "opentelemetry-sdk>=1.29",
  "opentelemetry-exporter-otlp>=1.29",
  "httpx>=0.27",
  "python-jose[cryptography]>=3.3",
]

[project.scripts]
mcp-toolkit = "mcp_toolkit.cli:app"

[project.urls]
Homepage = "https://github.com/sarmakska/mcp-server-toolkit"
Documentation = "https://github.com/sarmakska/mcp-server-toolkit/wiki"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
