[project]
name = "mcp-server-toolkit"
version = "1.2.0"
description = "Production-ready Model Context Protocol server starter with auth, tracing, schema validation, and a plugin system."
authors = [{ name = "Sarma Linux", email = "sarma@sarmalinux.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "mcp>=1.27.2",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.46.0",
  "pydantic>=2.13.4",
  "pydantic-settings>=2.14.1",
  "typer>=0.12",
  "structlog>=25.5.0",
  "opentelemetry-api>=1.41.1",
  "opentelemetry-sdk>=1.41.1",
  "opentelemetry-exporter-otlp>=1.41.1",
  "httpx>=0.28.1",
  "python-jose[cryptography]>=3.5.0",
  "jsonschema>=4.26.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
]

[project.scripts]
mcp-toolkit = "mcp_toolkit.cli:app"

[project.urls]
Homepage = "https://github.com/sarmakska/mcp-server-toolkit"
Documentation = "https://github.com/sarmakska/mcp-server-toolkit/wiki"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_toolkit"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
